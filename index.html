        :root {
            --navy: #0b2545;
            --navy-dark: #061529;
            --teal: #134074;
            --gold: #c88a1e;
            --bg: #eef2f6;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --ok-bg: #dcfce7;

            --bad-bg: #fee2e2;
            --bad-border: #b91c1c;
            --bad-text: #7f1d1d;
            --info-bg: #e0f2fe;
            --info-border: #0284c7;
            --info-text: #0c4a6e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .lang-btn {
            width: auto;
            padding: 7px 14px;
            font-size: 12.5px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: 700;
            border: 1px solid #cbd5e1;
        }

        .lang-btn.active {
            background: #c88a1e;
            color: #ffffff;
            border-color: #a87114;
        }

        #loginScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--teal));
        }

        .login-card {
            background: #fff;
            width: 100%;
            max-width: 460px;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            border-top: 5px solid var(--gold);
        }

        .login-card h2 {
            margin: 8px 0 6px;
            color: var(--navy);
            font-size: 20px;
            text-align: center;
        }

        .login-card p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .login-hint {
            margin-top: 14px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        #loginError {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: var(--bad-bg);
            color: var(--bad-text);
            border: 1px solid var(--bad-border);
            font-size: 13px;
            font-weight: 600;
        }

        #adminPortal { display: none; }

        header {
            background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--teal));
            color: #fff;
            padding: 18px 24px;
            box-shadow: 0 4px 16px rgba(6, 21, 41, 0.2);
            border-bottom: 4px solid var(--gold);
        }

        .header-inner {
            max-width: 1320px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 { margin: 0; font-size: 20px; }
        header p { margin: 4px 0 0; font-size: 12px; color: #cbd5e1; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-actions .lang-bar { margin-bottom: 0; }

        .badge-admin {
            background: rgba(200, 138, 30, 0.2);
            border: 1px solid var(--gold);
            color: #fde68a;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-reset {
            width: auto;
            padding: 7px 12px;
            background: #334155;
            color: #fff;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-logout {
            width: auto;
            padding: 7px 14px;
            background: #dc2626;
            color: #fff;
            font-size: 12px;
            border-radius: 8px;
        }

        .container {
            max-width: 1320px;
            margin: 22px auto;
            padding: 0 16px 48px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }

        .stat-box {
            background: var(--card);
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
