<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Magaalotaa — Sirna Kaadaastiraa, Master Plan & Bulchiinsa Lafaa</title>
    <style>
        :root {
            --navy: #0b2545;
            --navy-dark: #061529;
            --teal: #134074;
            --gold: #c88a1e;
            --bg: #eef2f6;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --ok-bg: #dcfce7;
            --ok-border: #15803d;
            --ok-text: #14532d;
            --warn-bg: #fef3c7;
            --warn-border: #b45309;
            --warn-text: #78350f;
            --bad-bg: #fee2e2;
            --bad-border: #b91c1c;
            --bad-text: #7f1d1d;
            --info-bg: #e0f2fe;
            --info-border: #0284c7;
            --info-text: #0c4a6e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        /* LOGIN SCREEN */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--teal));
        }

        .login-card {
            background: #fff;
            width: 100%;
            max-width: 440px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            border-top: 5px solid var(--gold);
        }

        .login-card h2 {
            margin: 0 0 6px;
            color: var(--navy);
            font-size: 20px;
            text-align: center;
        }

        .login-card p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .login-hint {
            margin-top: 14px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        #loginError {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: var(--bad-bg);
            color: var(--bad-text);
            border: 1px solid var(--bad-border);
            font-size: 13px;
            font-weight: 600;
        }

        /* MAIN APP */
        #adminPortal { display: none; }

        header {
            background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--teal));
            color: #fff;
            padding: 18px 24px;
            box-shadow: 0 4px 16px rgba(6, 21, 41, 0.2);
            border-bottom: 4px solid var(--gold);
        }

        .header-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 { margin: 0; font-size: 19px; }
        header p { margin: 4px 0 0; font-size: 12px; color: #cbd5e1; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .city-bar {
            background: #ffffff;
            border-bottom: 1px solid #dbe2ea;
            padding: 10px 16px;
        }

        .city-bar-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .city-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .city-btn {
            width: auto;
            padding: 7px 13px;
            font-size: 12.5px;
            border-radius: 999px;
            background: #e2e8f0;
            color: var(--navy);
        }

        .city-btn.active {
            background: var(--navy);
            color: #fff;
            box-shadow: 0 2px 6px rgba(11, 37, 69, 0.25);
        }

        .badge-admin {
            background: rgba(200, 138, 30, 0.2);
            border: 1px solid var(--gold);
            color: #fde68a;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-reset {
            width: auto;
            padding: 7px 12px;
            background: #334155;
            color: #fff;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-reset:hover { background: #1e293b; }

        .btn-logout {
            width: auto;
            padding: 7px 14px;
            background: #dc2626;
            color: #fff;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-logout:hover { background: #b91c1c; }

        .container {
            max-width: 1240px;
            margin: 20px auto;
            padding: 0 16px 48px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }

        .stat-box {
            background: var(--card);
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid #dbe2ea;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; }
        .stat-val { font-size: 22px; font-weight: 800; color: var(--navy); margin-top: 4px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
            border: 1px solid #dbe2ea;
        }

        .card h2 {
            margin-top: 0;
            font-size: 17px;
            color: var(--navy);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 12px; }

        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
            color: #1e293b;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            font-family: inherit;
        }

        textarea { min-height: 70px; resize: vertical; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(19, 64, 116, 0.14);
        }

        button {
            width: 100%;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-navy { background: var(--navy); color: #fff; }
        .btn-navy:hover { background: var(--navy-dark); }

        .btn-gold { background: var(--gold); color: #fff; }
        .btn-gold:hover { background: #a87114; }

        .btn-teal { background: var(--teal); color: #fff; }
        .btn-teal:hover { background: var(--navy); }

        .btn-green { background: #15803d; color: #fff; width: auto; padding: 6px 10px; font-size: 12px; }
        .btn-green:hover { background: #166534; }

        .btn-sms { background: #0284c7; color: #fff; width: auto; padding: 6px 10px; font-size: 12px; }
        .btn-sms:hover { background: #0369a1; }

        .quick-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            width: auto;
            padding: 6px 11px;
            font-size: 12px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #0f172a;
        }

        .chip:hover { background: #cbd5e1; }

        .status-box {
            margin-top: 14px;
            padding: 14px;
            border-radius: 10px;
            display: none;
            font-size: 13.5px;
        }

        .res-ok { background: var(--ok-bg); border: 1.5px solid var(--ok-border); color: var(--ok-text); }
        .res-warn { background: var(--warn-bg); border: 1.5px solid var(--warn-border); color: var(--warn-text); }
        .res-bad { background: var(--bad-bg); border: 1.5px solid var(--bad-border); color: var(--bad-text); }
        .res-info { background: var(--info-bg); border: 1.5px solid var(--info-border); color: var(--info-text); }

        .map-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 12px;
            font-weight: 600;
        }

        .legend span::before {
            content: "";
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 2px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .l-ok::before { background: #15803d; }
        .l-warn::before { background: #d97706; }
        .l-bad::before { background: #dc2626; }
        .l-mp::before { background: rgba(19, 64, 116, 0.14); border: 1px dashed #134074; }

        svg {
            width: 100%;
            height: 250px;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 9px 8px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        th {
            background: #f8fafc;
            color: var(--navy);
            font-weight: 700;
        }

        .pill {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .p-ok { background: var(--ok-bg); color: var(--ok-text); }
        .p-warn { background: var(--warn-bg); color: var(--warn-text); }
        .p-bad { background: var(--bad-bg); color: var(--bad-text); }

        .sms-feed {
            max-height: 210px;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sms-item {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12.5px;
        }

        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    </style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-card">
        <h2>🏛️ Sirna Kaadaastiraa &amp; Bulchiinsa Lafaa</h2>
        <p>Sample Magaalotaa — Bulee Horaa, Yaa'abello, Finfinnee &amp; Hawaasaa</p>

        <form id="loginForm">
            <div class="form-group">
                <label
